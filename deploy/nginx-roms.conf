# Add this location block inside your existing server { ... } block
# for your domain (e.g. your-domain.com) in Nginx on your server.
#
# IMPORTANT:
# 1. Use `^~` so regex rules (like `location ~* \.(zip|png|mp4)$`) do not
#    intercept ROM or artwork requests under `/roms`.
# 2. Do NOT put a trailing slash after the port in `proxy_pass`, because
#    Next.js is configured with `basePath: "/roms"`.

location ^~ /roms {
    proxy_pass http://127.0.0.1:39254;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Allow smooth streaming of gameplay MP4 videos and ROM downloads
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_cache_bypass $http_upgrade;
}
