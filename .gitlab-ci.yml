stages:
  - test
  - build

variables:
  # Disable Auto DevOps and Docker-based security templates
  GITLAB_FEATURES: ""
  SECRET_DETECTION_DISABLED: "true"
  SAST_DISABLED: "true"

# Verify dependencies and lint/typecheck
typecheck:
  stage: test
  script:
    - node -v
    - npm -v
    - npx tsc --noEmit

# Test the Next.js production build
next_build:
  stage: build
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - .next/