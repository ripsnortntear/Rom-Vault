# stages:
  - build

variables:
  GITLAB_FEATURES: ""
  SECRET_DETECTION_DISABLED: "true"
  SAST_DISABLED: "true"

build_and_verify:
  stage: build
  script:
    - export PATH="/usr/local/bin:/usr/bin:$PATH"
    - echo "[*] Installing dependencies..."
    - npm ci
    - echo "[*] Checking TypeScript types..."
    - npx tsc --noEmit
    - echo "[*] Running Next.js build..."
    - npm run build
  artifacts:
    expire_in: 2 days
    paths:
      - .next/