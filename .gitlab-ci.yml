stages:
  - build
  - deploy

variables:
  GITLAB_FEATURES: ""
  SECRET_DETECTION_DISABLED: "true"
  SAST_DISABLED: "true"
  SKIP_ENV_VALIDATION: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  SESSION_SECRET: "ci-dummy-session-secret-build-only-32bytes"
  DATABASE_URL: "mysql://build:build@localhost:3306/build"

build_and_verify:
  stage: build
  script:
    - export PATH="/usr/local/bin:/usr/bin:$PATH"
    - if [ -f /var/www/html/roms/.env ]; then cp /var/www/html/roms/.env .env.local; fi
    - echo "[*] Installing all dependencies (including devDependencies)..."
    - npm ci --include=dev
    - echo "[*] Checking TypeScript types..."
    - npx tsc --noEmit
    - echo "[*] Running Next.js build..."
    - npm run build
  artifacts:
    expire_in: 2 days
    paths:
      - .next/

deploy_production:
  stage: deploy
  dependencies:
    - build_and_verify
  only:
    - main
  script:
    - echo "[*] Syncing verified build artifacts to production directory..."
    - rsync -rlptD --delete --no-owner --no-group .next/ /var/www/html/roms/.next/
    - echo "[*] Restarting retro-gaming service..."
    - sudo /bin/systemctl restart retro-gaming.service
    - echo "[✓] Deployment complete and service restarted!"