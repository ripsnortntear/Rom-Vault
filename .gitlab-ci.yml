# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - test
  - build
  - deploy

variables:
  GITLAB_FEATURES: ''
  SECRET_DETECTION_DISABLED: 'true'
  SAST_DISABLED: 'true'
  SKIP_ENV_VALIDATION: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SESSION_SECRET: ci-dummy-session-secret-build-only-32bytes
  DATABASE_URL: mysql://build:build@localhost:3306/build

# Local directory-based build caching for self-hosted GitLab runner
# Persists .next/cache/ locally across pipeline runs to eliminate Next.js build cache warnings
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .next/cache/

unit_test:
  stage: test
  cache: []
  before_script:
    - export PATH="/usr/local/bin:/usr/bin:$PATH"
  script:
    - echo "[*] Installing dependencies..."
    - npm ci --include=dev --ignore-scripts
    - echo "[*] Running unit tests with JUnit report output..."
    - npx vitest run --passWithNoTests --reporter=default --reporter=junit --outputFile=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml

build_and_verify:
  stage: build
  before_script:
  - export PATH="/usr/local/bin:/usr/bin:$PATH"
  - if [ -f /var/www/html/roms/.env ]; then cp /var/www/html/roms/.env .env.local;
    fi
  script:
  - echo "[*] Installing dependencies..."
  - npm ci --include=dev --ignore-scripts
  - echo "[*] Checking TypeScript types..."
  - npx tsc --noEmit
  - echo "[*] Running Next.js build..."
  - npm run build
  artifacts:
    expire_in: 2 days
    paths:
    - ".next/"
    exclude:
    - ".next/cache/**"
deploy_production:
  stage: deploy
  cache: []
  dependencies:
  - build_and_verify
  only:
  - main
  script:
  - echo "[*] Syncing verified build artifacts to production directory..."
  - rsync -rD --delete --no-times --no-perms --no-owner --no-group --exclude="cache"
    .next/ /var/www/html/roms/.next/
  - echo "[*] Restarting retro-gaming service..."
  - sudo /bin/systemctl restart retro-gaming.service
  - echo "[✓] Deployment complete and service restarted!"
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
