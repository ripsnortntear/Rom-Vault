<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Play! PS2 Web Player</title>
  <link href="/roms/playjs/main.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #outputCanvas {
      width: 100vw;
      height: 100vh;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
      outline: none;
    }
    .global-column:nth-child(2) {
      display: none !important;
    }
    .global-row {
      display: flex;
      width: 100vw;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
  </style>
  <script>
    (function() {
      const params = new URLSearchParams(window.location.search);
      const romUrl = params.get("rom");

      const args = [];
      if (romUrl) {
        args.push("--disc", romUrl);
      }

      window.Module = {
        arguments: args,
        canvas: (function() {
          return document.getElementById("outputCanvas");
        })(),
        locateFile: function(path) {
          if (path.toLowerCase() === "play.wasm") {
            return "/roms/playjs/Play.wasm";
          }
          return "/roms/playjs/" + path;
        },
        onRuntimeInitialized: function() {
          console.log("[Play!] WebAssembly runtime loaded.");
          const canvas = document.getElementById("outputCanvas");
          if (canvas) canvas.focus();
        },
        print: function(text) { console.log("[Play!]", text); },
        printErr: function(text) { console.error("[Play! Error]", text); }
      };
    })();
  </script>
  <script defer="defer" src="/roms/playjs/main.js"></script>
</head>
<body>
  <div class="global-row">
    <div class="global-column">
      <div>
        <canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas>
      </div>
      <div id="root"></div>
    </div>
  </div>
</body>
</html>
