<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Play! PS2 Web Player</title>
  <link href="/roms/playjs/main.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      color: #e4e4e7;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .global-row {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .global-column:first-child {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .global-column:nth-child(2) {
      display: none !important;
    }
    #outputCanvas {
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100vh;
      object-fit: contain;
      display: block;
      margin: auto;
      outline: none;
      background: #000;
    }
    #root {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(4px);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    #root input[type="file"] {
      cursor: pointer;
      color: #a1a1aa;
      font-size: 13px;
    }
    #stream-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="stream-overlay" style="display: none;">
    <div class="spinner"></div>
    <div id="stream-msg" style="font-weight: 600; font-size: 15px;">Streaming PS2 Disc...</div>
    <div id="stream-sub" style="font-size: 12px; color: #a1a1aa; margin-top: 6px;">Authenticating secure stream</div>
  </div>

  <div class="global-row">
    <div class="global-column">
      <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas>
      </div>
      <div id="root"></div>
    </div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const romUrl = urlParams.get("rom");
      const overlay = document.getElementById("stream-overlay");
      const subMsg = document.getElementById("stream-sub");

      if (romUrl) {
        overlay.style.display = "flex";
      }

      class HttpRangeFile extends File {
        constructor(url, size, name) {
          super([], name, { type: "application/x-iso9660-image" });
          this._url = url;
          this._size = size;
          this._name = name;
        }

        get size() {
          return this._size;
        }

        get name() {
          return this._name;
        }

        slice(start, end) {
          const reqStart = Math.max(0, Number(start) || 0);
          const reqEnd = Math.min(this._size, end !== undefined ? Number(end) : this._size);
          const length = Math.max(0, reqEnd - reqStart);
          const rangeUrl = this._url;

          return {
            size: length,
            arrayBuffer: async () => {
              if (length === 0) return new ArrayBuffer(0);
              const res = await fetch(rangeUrl, {
                credentials: "include",
                headers: { "Range": `bytes=${reqStart}-${reqEnd - 1}` }
              });
              if (!res.ok && res.status !== 206) {
                console.error("[RangeStream] Request rejected:", res.status);
                throw new Error("HTTP 206 slice failed: " + res.status);
              }
              return await res.arrayBuffer();
            }
          };
        }
      }

      async function bootRangeStream() {
        if (!romUrl) {
          overlay.style.display = "none";
          return;
        }

        try {
          subMsg.textContent = "Connecting to storage stream...";
          const headRes = await fetch(romUrl, {
            credentials: "include",
            headers: { "Range": "bytes=0-32767" }
          });

          if (!headRes.ok && headRes.status !== 206) {
            throw new Error("Server rejected HTTP 206 range request (status " + headRes.status + ")");
          }

          const contentRange = headRes.headers.get("Content-Range");
          let totalBytes = 0;
          if (contentRange) {
            const match = contentRange.match(/\/(\d+)/);
            if (match) totalBytes = parseInt(match[1], 10);
          }
          if (!totalBytes) {
            totalBytes = parseInt(headRes.headers.get("Content-Length") || "0", 10);
          }

          const title = (urlParams.get("title") || "game").replace(/[^a-zA-Z0-9_\-\. ]/g, "").trim();
          const cleanName = title.toLowerCase().endsWith(".iso") ? title : title + ".iso";
          const streamingFile = new HttpRangeFile(romUrl, totalBytes, cleanName);

          subMsg.textContent = "Waiting for Play! WebAssembly engine...";

          let checks = 0;
          const pollTimer = setInterval(() => {
            checks++;
            const fileInput = document.querySelector('input[type="file"]');

            if (fileInput) {
              clearInterval(pollTimer);
              subMsg.textContent = "Mounting disc into VM...";

              const dt = new DataTransfer();
              dt.items.add(streamingFile);
              fileInput.files = dt.files;

              const nativeSetter = Object.getOwnPropertyDescriptor(
                window.HTMLInputElement.prototype,
                "files"
              )?.set;

              if (nativeSetter) {
                nativeSetter.call(fileInput, dt.files);
              }

              fileInput.dispatchEvent(new Event("input", { bubbles: true }));
              fileInput.dispatchEvent(new Event("change", { bubbles: true }));

              setTimeout(() => {
                overlay.style.display = "none";
              }, 1000);
            } else if (checks > 120) {
              clearInterval(pollTimer);
              overlay.style.display = "none";
            }
          }, 200);
        } catch (err) {
          console.error("[Stream Boot Error]", err);
          subMsg.textContent = "Stream error: " + err.message;
          setTimeout(() => { overlay.style.display = "none"; }, 3000);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", bootRangeStream);
      } else {
        bootRangeStream();
      }
    })();
  </script>
  <script defer="defer" src="/roms/playjs/main.js"></script>
</body>
</html>
