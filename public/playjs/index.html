<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Play! PS2 Web Player</title>
  <link href="/roms/playjs/main.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      color: #e4e4e7;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .global-row {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .global-column:first-child {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    .global-column:nth-child(2) {
      width: 320px;
      max-width: 35vw;
      height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background: #09090b;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    /* When embedded in an iframe inside the ROM Vault, collapse the help sidebar */
    body.embedded .global-column:nth-child(2) {
      display: none !important;
    }
    #outputCanvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: calc(100vh - 60px);
      object-fit: contain;
      display: block;
      margin: auto;
      outline: none;
      background: #000;
    }
    #root {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      background: #09090b;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    #root input[type="file"] {
      cursor: pointer;
      color: #a1a1aa;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="global-row">
    <div class="global-column">
      <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas>
      </div>
      <div id="root"></div>
    </div>
    <div class="global-column">
      <!-- Right sidebar for keyboard controls & credits -->
    </div>
  </div>

  <script>
    (function() {
      if (window.self !== window.top || new URLSearchParams(window.location.search).get("embedded") === "1") {
        document.body.classList.add("embedded");
      }
    })();
  </script>
  <script defer="defer" src="/roms/playjs/main.js"></script>
</body>
</html>
