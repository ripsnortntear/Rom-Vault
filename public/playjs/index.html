<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Play! PS2 Web Player</title>
  <link href="/roms/playjs/main.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #050508;
      color: #e4e4e7;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .global-row {
      display: flex;
      flex-direction: row;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .global-column:first-child {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
      overflow: hidden;
      min-width: 0;
    }
    .global-column:nth-child(2) {
      width: 320px;
      max-width: 35vw;
      height: 100vh;
      overflow-y: auto;
      padding: 1rem;
      background: #09090b;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    body.embedded .global-column:nth-child(2) {
      display: none !important;
    }
    #outputCanvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: calc(100vh - 54px);
      object-fit: contain;
      display: block;
      margin: auto;
      outline: none;
      background: #000;
    }
    #root {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 16px;
      background: #09090b;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    #stream-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #fff;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="stream-overlay" style="display: none;">
    <div class="spinner"></div>
    <div id="stream-msg" style="font-weight: 600; font-size: 15px;">Initializing PS2 Stream...</div>
    <div id="stream-sub" style="font-size: 12px; color: #a1a1aa; margin-top: 6px;">Handshaking range headers</div>
  </div>

  <div class="global-row">
    <div class="global-column">
      <div style="flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden;">
        <canvas id="outputCanvas" width="640" height="480" tabindex="-1"></canvas>
      </div>
      <div id="root"></div>
    </div>
    <div class="global-column"></div>
  </div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (window.self !== window.top || urlParams.get("embedded") === "1") {
        document.body.classList.add("embedded");
      }

      const romUrl = urlParams.get("rom");
      if (!romUrl) return;

      const overlay = document.getElementById("stream-overlay");
      const subMsg = document.getElementById("stream-sub");
      overlay.style.display = "flex";

      // Custom Blob that implements on-demand HTTP 206 slice streaming
      class HttpRangeBlob extends Blob {
        constructor(url, size, name) {
          super([], { type: "application/x-iso9660-image" });
          this._url = url;
          this._size = size;
          this.name = name;
        }

        get size() {
          return this._size;
        }

        slice(start, end) {
          const reqStart = Math.max(0, start || 0);
          const reqEnd = Math.min(this._size - 1, (end !== undefined ? end : this._size) - 1);
          const rangeUrl = this._url;

          return {
            size: Math.max(0, reqEnd - reqStart + 1),
            arrayBuffer: async () => {
              const res = await fetch(rangeUrl, {
                headers: { "Range": `bytes=${reqStart}-${reqEnd}` }
              });
              if (!res.ok && res.status !== 206) {
                throw new Error(`HTTP 206 Range failure: ${res.status}`);
              }
              return await res.arrayBuffer();
            }
          };
        }
      }

      async function bootstrapStream() {
        try {
          subMsg.textContent = "Connecting to streaming API...";
          const headRes = await fetch(romUrl, {
            headers: { "Range": "bytes=0-2047" }
          });

          if (!headRes.ok && headRes.status !== 206) {
            throw new Error("HTTP Range requests not accepted by server");
          }

          const contentRange = headRes.headers.get("Content-Range");
          let totalBytes = 0;
          if (contentRange) {
            const match = contentRange.match(/\/(\d+)/);
            if (match) totalBytes = parseInt(match[1], 10);
          }

          if (!totalBytes) {
            totalBytes = parseInt(headRes.headers.get("Content-Length") || "0", 10);
          }

          const virtualFileName = (urlParams.get("title") || "game").replace(/[^a-zA-Z0-9_\-\. ]/g, "") + ".iso";
          const streamingFile = new HttpRangeBlob(romUrl, totalBytes, virtualFileName);

          const pollTimer = setInterval(() => {
            checks++;
            const fileInput = document.querySelector('input[type="file"]');

            if (fileInput) {
